name: Release notes

# Single writer of the GitHub Release body (English only). The platform
# workflows (build-windows/macos/linux/android) only upload their files to the
# release; they never write or append to the body, so there is no ordering
# race between them.
#
# - Tag push (v*): wait (bounded) until the platform builds have attached
#   their assets, then write the versioned release body with a download
#   section only for the assets that actually exist.
# - Push to main: write one static install body on the rolling `latest`
#   prerelease (latest-body job).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to generate notes for (e.g. v1.0.172)'
        required: true
        type: string
      dry_run:
        description: 'Only print the body to the job summary, do not touch any release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release-notes:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 45 min asset wait + a few minutes of work.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bounded wait for the platform builds. "Release not found yet" counts as
      # "not yet" (the first platform upload creates the release). A dry run
      # makes a single pass instead of waiting.
      - name: Wait for release assets
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          EXPECTED=(
            "AlochiMonitoring-${VERSION}-Setup.exe"
            alochi-monitoring-windows.zip
            alochi-monitoring.msix
            alochi-monitoring.dmg
            "alochi-monitoring_${VERSION}_amd64.deb"
            alochi-monitoring-linux-x64.tar.gz
            app-release.apk
          )
          INTERVAL=60
          DEADLINE=$((SECONDS + 45 * 60))
          while true; do
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > release_assets.txt 2>/dev/null; then
              : > release_assets.txt
              echo "release ${TAG} not found yet"
            fi
            MISSING=()
            for a in "${EXPECTED[@]}"; do
              grep -qxF -- "$a" release_assets.txt || MISSING+=("$a")
            done
            [ ${#MISSING[@]} -eq 0 ] && { echo "all expected assets present"; break; }
            if [ "$DRY_RUN" = "true" ] || [ "$SECONDS" -ge "$DEADLINE" ]; then break; fi
            echo "waiting ${INTERVAL}s, missing: ${MISSING[*]}"
            sleep "$INTERVAL"
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::release ${TAG}: missing assets: ${MISSING[*]}"
            {
              echo "### Missing release assets"
              echo ""
              echo "These expected assets were not on release \`${TAG}\` when the body was written, so their download links are omitted:"
              echo ""
              for a in "${MISSING[@]}"; do echo "- \`$a\`"; done
              echo ""
              echo "Once the failed platform build is re-run, regenerate the body: Actions > Release notes > Run workflow (tag \`${TAG}\`, dry_run off)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null \
            || { echo "::error::tag ${TAG} not found"; exit 1; }
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          # release_assets.txt is written by the "Wait for release assets" step.
          has() { grep -qxF -- "$1" release_assets.txt; }

          # Previous release tag = the next lower v* tag after this one.
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | awk -v t="$TAG" 'f{print; exit} $0==t{f=1}' || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}${TAG}"

          FEATS=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^feat(\(.+\))?!?:' | sed -E 's/^feat(\(.+\))?!?:[[:space:]]*/- /' || true)
          FIXES=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^fix(\(.+\))?!?:' | sed -E 's/^fix(\(.+\))?!?:[[:space:]]*/- /' || true)
          OTHER=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^(chore|refactor|perf|docs|style|test)(\(.+\))?!?:' | sed -E 's/^[a-z]+(\(.+\))?!?:[[:space:]]*/- /' || true)

          {
            echo "<div align=\"center\">"
            echo ""
            echo "# 🖥️ Alochi Monitoring"
            echo "### v${VERSION}"
            echo ""
            echo "![Windows](https://img.shields.io/badge/Windows-10+-0078D4?style=flat-square&logo=windows&logoColor=white)"
            echo "![macOS](https://img.shields.io/badge/macOS-11+-000000?style=flat-square&logo=apple&logoColor=white)"
            echo "![Linux](https://img.shields.io/badge/Linux-x64-FCC624?style=flat-square&logo=linux&logoColor=black)"
            echo "![Android](https://img.shields.io/badge/Android-APK-3DDC84?style=flat-square&logo=android&logoColor=white)"
            echo "![Version](https://img.shields.io/badge/version-${VERSION}-4F46E5?style=flat-square)"
            echo ""
            echo "</div>"
            echo ""
            if [ -n "$FEATS" ]; then
              echo "## ✨ New features"
              echo "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "## 🐛 Bug fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "## 🔧 Other changes"
              echo "$OTHER"
              echo ""
            fi
            if [ -s release_assets.txt ]; then
              echo "## 📦 Downloads"
              echo ""
            fi
            if has "AlochiMonitoring-${VERSION}-Setup.exe" || has alochi-monitoring-windows.zip || has alochi-monitoring.msix; then
              echo "### 🪟 Windows"
              echo ""
              has "AlochiMonitoring-${VERSION}-Setup.exe" && echo "- **Installer (recommended):** [\`AlochiMonitoring-${VERSION}-Setup.exe\`](${BASE_URL}/AlochiMonitoring-${VERSION}-Setup.exe)"
              has alochi-monitoring-windows.zip && echo "- Portable ZIP: [\`alochi-monitoring-windows.zip\`](${BASE_URL}/alochi-monitoring-windows.zip)"
              has alochi-monitoring.msix && echo "- MSIX: [\`alochi-monitoring.msix\`](${BASE_URL}/alochi-monitoring.msix)"
              echo ""
            fi
            if has alochi-monitoring.dmg; then
              echo "### 🍎 macOS"
              echo ""
              echo "- DMG: [\`alochi-monitoring.dmg\`](${BASE_URL}/alochi-monitoring.dmg)"
              echo ""
              echo "Ad-hoc signed. On first launch **right-click → Open** to bypass Gatekeeper. See the [macOS installation guide](https://github.com/${REPO}/blob/main/docs/INSTALL_MACOS.md)."
              echo ""
            fi
            if has "alochi-monitoring_${VERSION}_amd64.deb" || has alochi-monitoring-linux-x64.tar.gz; then
              echo "### 🐧 Linux (x64)"
              echo ""
              has "alochi-monitoring_${VERSION}_amd64.deb" && echo "- Debian/Ubuntu package: [\`alochi-monitoring_${VERSION}_amd64.deb\`](${BASE_URL}/alochi-monitoring_${VERSION}_amd64.deb)"
              has alochi-monitoring-linux-x64.tar.gz && echo "- Tarball: [\`alochi-monitoring-linux-x64.tar.gz\`](${BASE_URL}/alochi-monitoring-linux-x64.tar.gz)"
              echo ""
              if has "alochi-monitoring_${VERSION}_amd64.deb"; then
                echo "\`\`\`bash"
                echo "sudo apt install ./alochi-monitoring_${VERSION}_amd64.deb"
                echo "\`\`\`"
                echo ""
              fi
            fi
            if has app-release.apk; then
              echo "### 🤖 Android"
              echo ""
              echo "- APK: [\`app-release.apk\`](${BASE_URL}/app-release.apk)"
              echo ""
            fi
            echo "SHA-256 digests are shown next to each asset below."
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "<div align=\"center\">"
              echo ""
              echo "**[Full changelog → ${PREV_TAG}...${TAG}](https://github.com/${REPO}/compare/${PREV_TAG}...${TAG})**"
              echo ""
              echo "</div>"
            fi
          } > release_notes.md

          cat release_notes.md

      - name: Show notes in job summary (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          {
            echo "## Release body preview (dry run, no release touched)"
            echo ""
            echo '```markdown'
            cat release_notes.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # body_path replaces the whole body (never append_body). No files here.
      - name: Write release body
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release_notes.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rolling `latest` prerelease: one static body, written here and nowhere else
  # (the platform workflows upload files only). The body is not parsed by
  # anything; install.ps1 reads asset digests from the API instead.
  latest-body:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Write latest release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          body: |
            ### Latest build from `main`

            Rolling prerelease, rebuilt on every push to `main`. Versioned releases are listed under Releases.

            **Windows**
            - Setup.exe (recommended): `AlochiMonitoring-<version>-Setup.exe`, double-click to install.
            - PowerShell (Administrator): `iex (irm https://raw.githubusercontent.com/rusthype/alochi-monitoring/main/install.ps1)`
            - Portable ZIP: `alochi-monitoring-windows.zip`, run `alochi_monitoring.exe`.

            **macOS:** `alochi-monitoring.dmg` (ad-hoc signed; first launch: right-click, Open).

            **Linux (x64):** `alochi-monitoring_<version>_amd64.deb` (`sudo apt install ./<file>.deb`) or `alochi-monitoring-linux-x64.tar.gz`.

            SHA-256 digests are shown next to each asset below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
