name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Configure code signing for CI
        run: |
          # Remove development team — CI has no Apple Developer certificate.
          # The app will be ad-hoc signed after build (see next step).
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = /' macos/Runner/Configs/AppInfo.xcconfig
          # Disable automatic signing so Xcode doesn't try to fetch a provisioning profile.
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintVerification -bool YES || true

      - name: Build macOS release
        run: flutter build macos --release

      - name: Ad-hoc codesign
        run: |
          APP="build/macos/Build/Products/Release/alochi_monitoring.app"
          # Sign with ad-hoc identity (-). The app is sandboxed and needs at
          # least ad-hoc signing to run. Users must right-click → Open on first
          # launch to bypass Gatekeeper on macOS 15+.
          codesign --force --deep --sign - \
            --entitlements macos/Runner/Release.entitlements \
            "$APP"
          codesign --verify --deep "$APP" && echo "Codesign OK"

      - name: Create DMG
        run: |
          APP="build/macos/Build/Products/Release/alochi_monitoring.app"
          # create-dmg produces a nicely formatted DMG with an Applications symlink.
          npm install -g create-dmg --silent
          # create-dmg exits 2 when notarization is skipped (expected in CI).
          create-dmg \
            --overwrite \
            --dmg-title "Alochi Monitoring" \
            "$APP" \
            . || [ $? -eq 2 ]
          # Normalize filename regardless of version suffix create-dmg adds.
          DMG=$(find . -maxdepth 1 -name "*.dmg" | head -1)
          mv "$DMG" alochi-monitoring.dmg
          echo "DMG: $(ls -lh alochi-monitoring.dmg | awk '{print $5, $9}')"

      # ── Update manifest (static release-asset JSON, NOT api.github.com) ──
      # Consumed by lib/core/services/update_service.dart to check for
      # updates without hitting GitHub's unauthenticated REST API rate limit
      # (60 req/hour per IP — a problem for schools sharing one public IP).
      # DMG creation above is unconditional (no continue-on-error), so this
      # file always exists by the time "Upload to latest prerelease" runs.
      - name: Generate macOS update manifest
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/alochi-monitoring.dmg"
          cat > latest-macos.json << JSON
          {"version": "$VERSION", "pub_date": "$PUB_DATE", "url": "$URL"}
          JSON
          echo "latest-macos.json:"
          cat latest-macos.json

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"

          FEATS=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^feat(\(.+\))?!?:' | sed -E 's/^feat(\(.+\))?!?:[[:space:]]*/- /')
          FIXES=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^fix(\(.+\))?!?:' | sed -E 's/^fix(\(.+\))?!?:[[:space:]]*/- /')
          OTHER=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^(chore|refactor|perf|docs|style|test)(\(.+\))?!?:' | sed -E 's/^[a-z]+(\(.+\))?!?:[[:space:]]*/- /')

          DMG_SIZE=$(ls -lh alochi-monitoring.dmg | awk '{print $5}')
          DMG_SHA256=$(shasum -a 256 alochi-monitoring.dmg | awk '{print $1}')
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          {
            echo "<div align=\"center\">"
            echo ""
            echo "# 🖥️ Alochi Monitoring"
            echo "### v${VERSION}"
            echo ""
            echo "![macOS](https://img.shields.io/badge/macOS-11+-000000?style=flat-square&logo=apple&logoColor=white)"
            echo "![Version](https://img.shields.io/badge/version-${VERSION}-4F46E5?style=flat-square)"
            echo ""
            echo "</div>"
            echo ""
            if [ -n "$FEATS" ]; then
              echo "## ✨ New features"
              echo "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "## 🐛 Bug fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "## 🔧 Other changes"
              echo "$OTHER"
              echo ""
            fi
            echo "## 📦 Download"
            echo ""
            echo "|  | File | Size |"
            echo "|---|---|---|"
            echo "| 🍎 macOS DMG | [\`alochi-monitoring.dmg\`](${BASE_URL}/alochi-monitoring.dmg) | ${DMG_SIZE} |"
            echo ""
            echo "Ad-hoc signed. First launch: **right-click → Open** to bypass Gatekeeper — see [macOS o'rnatish qo'llanmasi](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL_MACOS.md)."
            echo ""
            echo "**SHA256 (DMG):** \`${DMG_SHA256}\`"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              echo "<div align=\"center\">"
              echo ""
              echo "**[Full changelog → ${PREV_TAG}...${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME})**"
              echo ""
              echo "</div>"
            fi
          } > release_notes.md

      - name: Upload to latest prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            alochi-monitoring.dmg
            latest-macos.json
          body: |
            **macOS DMG** — Latest build from `main` branch (v${{ steps.version.outputs.version }})

            Ad-hoc signed. First launch: **right-click → Open** to bypass Gatekeeper.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          fail_on_unmatched_files: true
          files: alochi-monitoring.dmg
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        if: startsWith(github.ref, 'refs/tags/v')
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: alochi-monitoring
          formula-path: Casks/alochi-monitoring.rb
          homebrew-tap: rusthype/homebrew-alochi
          download-url: https://github.com/rusthype/alochi-monitoring/releases/download/${{ github.ref_name }}/alochi-monitoring.dmg
          commit-message: "bump alochi-monitoring to ${{ github.ref_name }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
