name: Build Linux (tar.gz + deb)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    # Older glibc than ubuntu-latest: the bundle runs on Ubuntu 22.04+ and Debian 12+.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          # lld + llvm: Flutter's native-assets build step looks for ld.lld and
          # llvm-ar next to clang (missing on a plain Debian `clang`; installed
          # explicitly so the result does not depend on the runner image).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Guard offline production public keys
        shell: bash
        run: |
          bad="2ba8a1673058f198e6348c727150bb704bb3f0c619663ca5b850945c0b33a25a f508d7b40fec7a51d9eeba7097f7263220c16589ba74e9c85bf1d486ca5b4624"
          for f in offline_keys/signing_public.pem offline_keys/results_public.pem; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
            openssl pkey -pubin -in "$f" -noout || { echo "::error::$f is not a public key"; exit 1; }
            fp=$(openssl pkey -pubin -in "$f" -outform DER | openssl dgst -sha256 | awk '{print $NF}')
            echo "$f sha256(DER)=$fp"
            for b in $bad; do
              [ "$fp" != "$b" ] || { echo "::error::$f is a TEST key"; exit 1; }
            done
          done

      - name: Guard kiosk command public key
        shell: bash
        run: |
          f=kiosk_keys/command_public.pem
          [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          if grep -q PRIVATE "$f"; then echo "::error::$f contains a PRIVATE key"; exit 1; fi
          openssl pkey -pubin -in "$f" -noout || { echo "::error::$f is not a public key"; exit 1; }
          txt=$(openssl pkey -pubin -in "$f" -text -noout)
          case "$txt" in ED25519*) ;; *) echo "::error::$f is not an Ed25519 key"; exit 1 ;; esac

      - name: Build Linux release
        run: |
          SIG=$(base64 < offline_keys/signing_public.pem | tr -d '\n')
          RES=$(base64 < offline_keys/results_public.pem | tr -d '\n')
          KIOSK=$(base64 < kiosk_keys/command_public.pem | tr -d '\n')
          flutter build linux --release \
            "--dart-define=OFFLINE_SIGNING_PUBKEY_B64=$SIG" \
            "--dart-define=OFFLINE_RESULTS_PUBKEY_B64=$RES" \
            "--dart-define=KIOSK_COMMAND_PUBKEY_B64=$KIOSK"

      - name: Package tar.gz and deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUNDLE=build/linux/x64/release/bundle
          # Alochi logo, extracted from windows/runner/resources/app_icon.ico. (Not
          # macos/.../AppIcon.appiconset: that set is still the Flutter default.)
          ICONS=linux/packaging/icons
          # Must equal APPLICATION_ID (linux/CMakeLists.txt): GNOME/Wayland map a
          # window to its launcher by "<app-id>.desktop", so the desktop file
          # name and StartupWMClass have to be this exact id.
          APP_ID=uz.alochi.alochiMonitoring
          [ -x "$BUNDLE/alochi_monitoring" ] || { echo "::error::bundle binary missing"; exit 1; }
          for sz in 48 64 128 256; do
            [ -f "$ICONS/alochi-monitoring-${sz}.png" ] || { echo "::error::missing icon $sz"; exit 1; }
          done

          # Desktop entry shared by both packages. Exec is a bare command so it
          # resolves via /usr/bin (deb) or the user's own PATH/launcher (tar.gz).
          cat > "$APP_ID.desktop" << DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Alochi Monitoring
          Comment=Student testing and monitoring
          Exec=alochi-monitoring
          Icon=alochi-monitoring
          Terminal=false
          Categories=Education;
          StartupWMClass=$APP_ID
          DESKTOP

          # ── tar.gz: bundle + desktop file + icon in one top-level folder ──
          # The PNG next to the binary is the window-icon fallback used by
          # my_application.cc when no themed icon is installed.
          STAGE=alochi-monitoring-linux-x64
          rm -rf "$STAGE"
          mkdir "$STAGE"
          cp -a "$BUNDLE"/. "$STAGE"/
          cp "$APP_ID.desktop" "$STAGE"/
          cp "$ICONS/alochi-monitoring-256.png" "$STAGE"/alochi-monitoring.png
          tar -czf alochi-monitoring-linux-x64.tar.gz "$STAGE"

          # ── deb (plain dpkg-deb) ──
          ROOT=debroot
          rm -rf "$ROOT"
          install -d "$ROOT/DEBIAN" "$ROOT/opt/alochi-monitoring" "$ROOT/usr/bin" \
            "$ROOT/usr/share/applications"
          cp -a "$BUNDLE"/. "$ROOT/opt/alochi-monitoring/"
          ln -s /opt/alochi-monitoring/alochi_monitoring "$ROOT/usr/bin/alochi-monitoring"
          install -m 0644 "$APP_ID.desktop" "$ROOT/usr/share/applications/$APP_ID.desktop"
          for sz in 48 64 128 256; do
            d="$ROOT/usr/share/icons/hicolor/${sz}x${sz}/apps"
            install -d "$d"
            install -m 0644 "$ICONS/alochi-monitoring-${sz}.png" "$d/alochi-monitoring.png"
          done
          # Refresh icon/desktop caches so the launcher icon shows without a
          # reboot. Every call is optional and must never fail the install.
          cat > "$ROOT/DEBIAN/postinst" << 'POSTINST'
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q || true
          fi
          exit 0
          POSTINST
          cp "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/postrm"
          chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/postrm"
          SIZE_KB=$(du -sk "$ROOT" | cut -f1)
          cat > "$ROOT/DEBIAN/control" << CONTROL
          Package: alochi-monitoring
          Version: ${VERSION}
          Section: education
          Priority: optional
          Architecture: amd64
          Maintainer: Alochi Education <support@alochi.org>
          Homepage: https://alochi.org
          Installed-Size: ${SIZE_KB}
          Depends: libgtk-3-0, libsecret-1-0, libsqlite3-0
          Recommends: gnome-keyring, zenity, xdg-utils, gnome-screenshot, scrot
          Description: Alochi Monitoring
           Student testing and monitoring app for schools.
          CONTROL
          cat "$ROOT/DEBIAN/control"
          chmod -R u=rwX,go=rX "$ROOT"
          dpkg-deb --root-owner-group --build "$ROOT" "alochi-monitoring_${VERSION}_amd64.deb"

          ls -lh alochi-monitoring-linux-x64.tar.gz alochi-monitoring_*_amd64.deb
          dpkg-deb --info "alochi-monitoring_${VERSION}_amd64.deb"
          dpkg-deb --contents "alochi-monitoring_${VERSION}_amd64.deb" | sed -n '1,25p'

      # Static update manifest (release asset, not api.github.com) read by
      # lib/core/services/update_service.dart. `url`/`sha256` stay the tar.gz
      # (older clients just open the release page); `deb_*` is what a .deb
      # install downloads and installs itself through pkexec.
      - name: Generate Linux update manifest
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/alochi-monitoring-linux-x64.tar.gz"
          SHA256=$(sha256sum alochi-monitoring-linux-x64.tar.gz | awk '{print $1}')
          SIZE=$(stat -c%s alochi-monitoring-linux-x64.tar.gz)
          DEB="alochi-monitoring_${VERSION}_amd64.deb"
          DEB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/${DEB}"
          DEB_SHA256=$(sha256sum "$DEB" | awk '{print $1}')
          DEB_SIZE=$(stat -c%s "$DEB")
          printf '{"version": "%s", "pub_date": "%s", "url": "%s", "sha256": "%s", "size": %s, "deb_url": "%s", "deb_sha256": "%s", "deb_size": %s}\n' \
            "$VERSION" "$PUB_DATE" "$URL" "$SHA256" "$SIZE" "$DEB_URL" "$DEB_SHA256" "$DEB_SIZE" > latest-linux.json
          echo "latest-linux.json:"
          cat latest-linux.json

      # NOTE: no upload-artifact for release pushes — build outputs ship via
      # GitHub Releases (Actions artifact storage quota, see build-windows.yml).
      # Manual dispatch from a branch is the one exception: it is a dry run
      # and must never touch a release, so it keeps a short-lived artifact.
      - name: Upload branch dry-run artifact
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: alochi-monitoring-linux
          path: |
            alochi-monitoring-linux-x64.tar.gz
            alochi-monitoring_*_amd64.deb
          retention-days: 3

      - name: Upload to latest prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            alochi-monitoring-linux-x64.tar.gz
            alochi-monitoring_*_amd64.deb
            latest-linux.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Files only — the release body is written once by release-notes.yml.
      - name: Upload to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            alochi-monitoring-linux-x64.tar.gz
            alochi-monitoring_*_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
