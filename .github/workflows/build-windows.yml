name: Build Windows (EXE + MSIX)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      submit_winget:
        description: 'Winget-pkgs ga submit qilish'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    outputs:
      zip_sha256:  ${{ steps.hashes.outputs.zip_sha256 }}
      msix_sha256: ${{ steps.hashes.outputs.msix_sha256 }}
      version:     ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # ── 1. ZIP build ─────────────────────────────────────────
      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Sign app EXE (Authenticode)
        continue-on-error: true
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { Write-Host "Imzo siri yo'q - imzosiz davom etamiz"; exit 0 }
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "build\windows\x64\runner\Release\alochi_monitoring.exe"
          Write-Host "App EXE imzolandi"

      - name: Create ZIP installer
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "alochi-monitoring-windows.zip"
          Copy-Item "alochi-monitoring-windows.zip" "alochi-monitoring-app-latest.zip"
          Write-Host "ZIP OK: $('{0:N1}' -f ((Get-Item 'alochi-monitoring-windows.zip').Length/1MB)) MB"

      # ── 2. MSIX build ────────────────────────────────────────
      - name: Build MSIX
        shell: pwsh
        run: |
          dart run msix:create --build-windows false
          if (Test-Path "build\windows\alochi-monitoring.msix") {
            Write-Host "MSIX OK"
          } else {
            Write-Host "MSIX topilmadi, ZIP bilan davom etamiz"
          }


      # ── 3. Inno Setup installer (.exe) ──────────────────────
      - name: Build Inno Setup installer
        shell: pwsh
        id: inno
        continue-on-error: true
        run: |
          $v = (Get-Content pubspec.yaml | Select-String "^version:" | ForEach-Object { $_ -replace "version:\s*", "" -replace "\+.*", "" }).Trim()
          Write-Host "Building installer for version $v"
          choco install innosetup --no-progress -y 2>$null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            New-Item -ItemType Directory -Force -Path "installer_output" | Out-Null
            & $iscc /DMyAppVersion=$v "windows\installer.iss"
            $exeName = "AlochiMonitoring-$v-Setup.exe"
            $exePath = "windows\installer_output\$exeName"
            if (Test-Path $exePath) {
              Copy-Item $exePath ".\$exeName"
              Write-Host "Installer OK: $exeName"
              echo "installer_name=$exeName" >> $env:GITHUB_OUTPUT
              echo "installer_version=$v" >> $env:GITHUB_OUTPUT
            } else {
              Write-Host "Installer not found, continuing without .exe"
              echo "installer_name=" >> $env:GITHUB_OUTPUT
            }
          } else {
            Write-Host "Inno Setup not found, skipping"
            echo "installer_name=" >> $env:GITHUB_OUTPUT
          }

      - name: Sign installer EXE (Authenticode)
        continue-on-error: true
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) { Write-Host "Imzo siri yo'q - o'tkazib yuboramiz"; exit 0 }
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          if (-not (Test-Path $pfx)) { [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)) }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          Get-ChildItem -Path . -Filter "AlochiMonitoring-*-Setup.exe" | ForEach-Object { & $signtool sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName; Write-Host ("Imzolandi: " + $_.Name) }

      # ── 4. SHA256 ─────────────────────────────────────────────
      - name: Calculate SHA256
        id: hashes
        shell: pwsh
        run: |
          $zipHash  = (Get-FileHash "alochi-monitoring-windows.zip" -Algorithm SHA256).Hash
          Write-Host "ZIP SHA256: $zipHash"
          echo "zip_sha256=$zipHash" >> $env:GITHUB_OUTPUT

          $msixPath = "build\windows\alochi-monitoring.msix"
          if (Test-Path $msixPath) {
            $msixHash = (Get-FileHash $msixPath -Algorithm SHA256).Hash
            Write-Host "MSIX SHA256: $msixHash"
            Copy-Item $msixPath "alochi-monitoring.msix"
          } else {
            $msixHash = $zipHash
          }
          echo "msix_sha256=$msixHash" >> $env:GITHUB_OUTPUT

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content pubspec.yaml | Select-String "^version:" | ForEach-Object { $_ -replace "version:\s*", "" -replace "\+.*", "" }).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # ── 4. Artifacts ──────────────────────────────────────────
      - name: Upload ZIP artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: alochi-monitoring-windows
          path: alochi-monitoring-windows.zip
          retention-days: 90

      - name: Upload MSIX artifact
        if: hashFiles('alochi-monitoring.msix') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: alochi-monitoring-msix
          path: alochi-monitoring.msix
          retention-days: 90

      # ── 5. Latest release ─────────────────────────────────────
      - name: Update 'latest' release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          files: |
            alochi-monitoring-windows.zip
            alochi-monitoring-app-latest.zip
            AlochiMonitoring-*-Setup.exe
          body: |
            ### O'rnatish

            **Setup.exe (tavsiya) — eng oson:**
            Quyidagi `AlochiMonitoring-<version>-Setup.exe` faylini yuklab, 2 marta bosib o'rnating.

            **PowerShell (Admin) — muqobil:**
            ```powershell
            iex (irm https://raw.githubusercontent.com/rusthype/alochi-monitoring/main/install.ps1)
            ```

            **ZIP (portable):**
            `alochi-monitoring-windows.zip` -> `alochi_monitoring.exe`

      # ── 6. Versioned release (tag) ────────────────────────────
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alochi-monitoring-windows.zip
            alochi-monitoring.msix
            AlochiMonitoring-*-Setup.exe
          generate_release_notes: true

  # ── Winget manifest submit ────────────────────────────────────
  submit-winget:
    needs: build-windows
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      (github.ref == 'refs/heads/main' && github.event.inputs.submit_winget == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update winget manifest
        env:
          VERSION:     ${{ needs.build-windows.outputs.version }}
          ZIP_SHA256:  ${{ needs.build-windows.outputs.zip_sha256 }}
          MSIX_SHA256: ${{ needs.build-windows.outputs.msix_sha256 }}
          TAG:         ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${TAG:-v${VERSION}}"
          ZIP_URL="https://github.com/rusthype/alochi-monitoring/releases/download/${RELEASE_TAG}/alochi-monitoring-windows.zip"

          # Manifest generator
          cat > /tmp/Alochi.Monitoring.yaml << YAML
          PackageIdentifier: Alochi.Monitoring
          PackageVersion: ${VERSION}
          PackageName: Alochi Monitoring
          Publisher: Alochi Education
          PublisherUrl: https://alochi.org
          PublisherSupportUrl: https://alochi.org/support
          PackageUrl: https://github.com/rusthype/alochi-monitoring
          License: Proprietary
          LicenseUrl: https://alochi.org/license
          ShortDescription: Maktab monitoring test tizimi
          Description: |
            Alochi Monitoring — o'quvchilar uchun matematik va ingliz tili
            monitoring testlarini o'tkazish tizimi. Offline rejimda ham ishlaydi.
          Tags:
            - education
            - monitoring
            - test
            - school
            - uzbekistan
          Moniker: alochi-monitoring
          PackageLocale: uz-UZ
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          ---
          PackageIdentifier: Alochi.Monitoring
          PackageVersion: ${VERSION}
          Platform:
            - Windows.Desktop
          MinimumOSVersion: 10.0.17763.0
          InstallerType: zip
          Installers:
            - Architecture: x64
              InstallerUrl: ${ZIP_URL}
              InstallerSha256: ${ZIP_SHA256}
              NestedInstallerType: portable
              NestedInstallerFiles:
                - RelativeFilePath: alochi_monitoring.exe
                  PortableCommandAlias: alochi-monitoring
          ManifestType: installer
          ManifestVersion: 1.6.0
          YAML

          echo "Manifest tayyorlandi:"
          cat /tmp/Alochi.Monitoring.yaml

      - name: Submit to winget-pkgs
        if: startsWith(github.ref, 'refs/tags/')
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Alochi.Monitoring
          release-tag: ${{ github.ref_name }}
          installers-regex: 'alochi-monitoring-windows\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
