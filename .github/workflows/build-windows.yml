name: Build & Release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package ZIP with VC++ DLLs
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $sys = "$env:SystemRoot\System32"
          foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            $p = Join-Path $sys $dll
            if (Test-Path $p) { Copy-Item $p $src; Write-Host "+ $dll" }
          }
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v') { $tag } else { "dev" }
          $zip = "alochi-monitoring-$ver-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "ZIP=$zip" >> $env:GITHUB_ENV
          "SHA256=$hash" >> $env:GITHUB_ENV
          "VER=$ver"  >> $env:GITHUB_ENV
          Write-Host "✅ $zip"
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alochi-monitoring-windows
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          body: |
            ## Alochi Monitoring ${{ env.VER }}

            ### O'rnatish:
            ```powershell
            winget install uz.alochi.Monitoring
            ```

            **SHA256:** `${{ env.SHA256 }}`

      - name: Generate winget manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ env.VER }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.ZIP }}"
          $sha = "${{ env.SHA256 }}"
          Write-Host "=== Winget manifest ==="
          Write-Host "Version:  $ver"
          Write-Host "URL:      $url"
          Write-Host "SHA256:   $sha"
          Write-Host ""
          Write-Host "PR URL: https://github.com/microsoft/winget-pkgs"
