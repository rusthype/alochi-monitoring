name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create installer zip
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $out = "alochi-monitoring-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $out
          Write-Host "ZIP created: $out"
          # Latest uchun ham nusxa
          Copy-Item $out "alochi-monitoring-app-latest.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alochi-monitoring-windows
          path: alochi-monitoring-windows.zip
          retention-days: 90

      - name: Auto-release (main branch — latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          files: |
            alochi-monitoring-windows.zip
            alochi-monitoring-app-latest.zip
          body: |
            Oxirgi Windows build. Quyidagi buyruq bilan o'rnatish:
            ```powershell
            iex (irm https://raw.githubusercontent.com/rusthype/alochi-monitoring/main/install.ps1)
            ```

      - name: Versioned release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alochi-monitoring-windows.zip
            alochi-monitoring-app-latest.zip
          generate_release_notes: true
