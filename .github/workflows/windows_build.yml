name: Build Windows Exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Build Folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AlochiMonitoring-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlochiMonitoring-Windows
          path: AlochiMonitoring-Windows.zip

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/installer.iss
          options: /DMyAppVersion=1.0.0

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlochiMonitoring-Setup
          path: windows/installer_output/
