function magicSquareSVG(vals) {
  let cells='';
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    const x=10+c*60, y=10+r*60, v=vals[r][c], u=v===null;
    cells+=`<rect x="${x}" y="${y}" width="56" height="56" rx="6" fill="${u?'#FFF8E1':'#EEF4FF'}" stroke="${u?'#F9A825':'#4B7BE5'}" stroke-width="${u?2:1.5}"/>`;

}

function seededRnd(seed, min, max) {
  // LCG algoritm
  const a=1664525, c=1013904223, m=2**32;
  seed = (a*seed+c) % m;
  return {val: min + (seed % (max-min+1)), seed};
}

function mkOpts(cor, wrongs) {
  // 4 ta variant: 1 to'g'ri + 3 noto'g'ri, random tartibda
  const all = [cor, ...wrongs.filter(w=>w!==cor).slice(0,3)];
  while(all.length<4) all.push(cor + all.length + 1);
  // Deterministik shuffle (oddiy)
  const L=['A','B','C','D'];
  // cor ni random pozitsiyaga qo'yish
  const corPos = cor % 4; // oddiy deterministik
  const result = ['','','',''];
  result[corPos] = String(cor);
  let wi=0;
  for(let i=0;i<4;i++) if(i!==corPos) {result[i]=String(wrongs[wi]||cor+10); wi++;}
  const corLetter = L[corPos];
  return {opts: result.map((v,i)=>({l:L[i],v})), cor:corLetter};
}

function mkOptsStr(corIdx, items) {
  // String javoblar uchun
  const L=['A','B','C','D'];
  return {
    opts: items.map((v,i)=>({l:L[i],v})),
    cor: L[corIdx]
  };
}

function genVariant(v) {
  // v = 1..35
  // Har savol uchun o'z seed'i
  // Har savol o'z seed'iga ega: v*100 + questionId
  // Bu barcha 65 variantda savollar haqiqatan farqli bo'lishini ta'minlaydi
  let s = v * 1000;
  function R(min,max,qSeed){
    let seed = qSeed !== undefined ? qSeed : s;
    const a=1664525, c=1013904223, m=2**32;
    seed = (a*seed+c) % m;
    if(qSeed === undefined) s = seed;
    return min + (seed % (max-min+1));
  }
  function Rq(qId,min,max,offset=0){
    // XOR hash: har variant+savol+offset uchun unikal natija
    let seed = ((v * 73856093) ^ (qId * 19349663) ^ (offset * 83492791)) >>> 0;
    const a=1664525, c=1013904223, m=2**32;
    seed = (a*seed+c) % m;
    seed = (a*seed+c) % m; // ikki marta hash
    return min + (seed % (max-min+1));
  }
  function pick(arr){return arr[R(0,arr.length-1)];}
  function pickq(qId,arr,off=0){return arr[Rq(qId,0,arr.length-1,off)];}

  const qs = [];

  // ─────────────────────────────────────
  // 1-BOB: 8 ta savol
  // ─────────────────────────────────────

  // Q1: §1 Qo'shish (bir xonali)
  {
    const a=Rq(1,3,9), b=Rq(1,2,6,1);
    const ans=a+b;
    const {opts,cor}=mkOpts(ans,[ans+1,ans-1,a+b+2].filter(x=>x>0&&x!==ans));
    qs.push({id:1,bob:'B1',par:'§1',tag:'Qo\'shish',
      q:`Hisoblang: ${a} + ${b} = ?`, svg:null, opts,cor,
      why:`${a} + ${b} = ${ans}`});
  }

  // Q2: §2 Ayirish (bir xonali)
  {
    const b=Rq(2,2,6), a=b+Rq(2,2,5,1);
    const ans=a-b;
    const {opts,cor}=mkOpts(ans,[ans+1,a,b].filter(x=>x>0&&x!==ans));
    qs.push({id:2,bob:'B1',par:'§2',tag:'Ayirish',
      q:`Hisoblang: ${a} − ${b} = ?`, svg:null, opts,cor,
      why:`${a} − ${b} = ${ans}`});
  }

  // Q3: §3 Eng katta son
  {
    const pool=[1,2,3,4,5,6,7,8,9];
  }

        {l:'C',v:`${h*10}+${t}+${b}`},
        {l:'D',v:`${h*100}+${t}+${b*10}`}
      ],
      cor:'B',
      why:`${num} = ${h*100} + ${t*10} + ${b}`});
  }

  // Q34: §47 Solishtirish (3 xonali)
  {
    const a1=Rq(34,100,500),b1=Rq(34,50,200,1),a2=Rq(34,300,700,2),b2=Rq(34,50,200,3);
    const left=a1+b1,right=a2-b2;
    const sign=left>right?'>':left<right?'<':'=';
    qs.push({id:34,bob:'B4',par:'§47',tag:'Solishtirish',
      q:`"..." o'rniga to'g'ri belgini qo'ying:\n${a1} + ${b1}  ...  ${a2} − ${b2}`,
      svg:null,
      opts:[{l:'A',v:'>'},{l:'B',v:'<'},{l:'C',v:'='},{l:'D',v:'hech biri'}],
      cor:sign==='>'?'A':sign==='<'?'B':'C',
      why:`${left} ${sign} ${right}`});
  }

  // Q35: §47 Tartib
  {
    const nums=[Rq(35,100,300),Rq(35,301,500,1),Rq(35,501,700,2),Rq(35,200,400,3),Rq(35,401,600,4)];
    const sorted=[...nums].sort((a,b)=>a-b);
    qs.push({id:35,bob:'B4',par:'§47',tag:'Tartib',
      q:`Sonlarni o'sish tartibida joylashtiring:\n${nums.join(', ')}`,
      svg:null,
      opts:[
        {l:'A',v:sorted.join(', ')},
        {l:'B',v:[...sorted].reverse().join(', ')},
        {l:'C',v:[sorted[0],sorted[2],sorted[1],sorted[3],sorted[4]].join(', ')},
        {l:'D',v:[sorted[1],sorted[0],sorted[2],sorted[4],sorted[3]].join(', ')}
      ],
      cor:'A',
      why:`Eng kichikdan kattagacha: ${sorted.join(' < ')}`});
  }

  // Q36: §48 Qo'shish (3 xonali)
  {
    const a=Rq(36,100,600),b=Rq(36,100,400,1);
    const ans=a+b;
    const o=mkOpts(ans,[ans+10,ans-10,ans+100].filter(x=>x!==ans&&x>0));
    qs.push({id:36,bob:'B4',par:'§48',tag:'Qo\'shish',
      q:`Hisoblang: ${a} + ${b} = ?`, svg:null,opts:o.opts,cor:o.cor,
      why:`${a} + ${b} = ${ans}`});
  }

  // Q37: §49 Mingdan ayirish
  {
    const a=Rq(37,101,899);
    const ans=1000-a;
    const o=mkOpts(ans,[a,ans+1,1000+a].filter(x=>x!==ans&&x>0));
    qs.push({id:37,bob:'B4',par:'§49',tag:'Mingdan ayirish',
      q:`Hisoblang: 1000 − ${a} = ?`, svg:null,opts:o.opts,cor:o.cor,
      why:`1000 − ${a} = ${ans}`});
  }

  // Q38: §50 Tenglama (ABCD)
  {
    const x=Rq(38,100,500),a=Rq(38,50,300,1);
    const b=x+a;
    const o=mkOpts(x,[b,a,x+100].filter(v=>v!==x&&v>0));
    qs.push({id:38,bob:'B4',par:'§50',tag:'Tenglama',
      q:`Tenglamani yeching: x + ${a} = ${b}`,
      svg:null,opts:o.opts,cor:o.cor,
      why:`x = ${b} − ${a} = ${x}`});
  }

  // Q39: §51 Matnli masala (yozma, murakkab)
  {
    const d1=Rq(39,200,350),diff=Rq(39,40,80,1),extra=Rq(39,60,100,2);
    const d2=d1-diff, d3=d2+extra;
    const total=d1+d2+d3;
    const names=[
      {who:'Pochtachi',what:'xat',verb:'tarqatdi'},
      {who:'Haydovchi',what:'yo\'lovchi',verb:'tashidi'},
      {who:'Do\'kon',what:'mahsulot',verb:'sotdi'},
    ];
    const n=names[Rq(39,0,2,3)];
    qs.push({id:39,bob:'B4',par:'§51',tag:'Yozma — Matnli masala',
      isWrite:true,
      q:`${n.who} birinchi kuni ${d1} ta ${n.what} ${n.verb}, ikkinchi kuni birinchi kundan ${diff} ta kam, uchinchi kuni ikkinchi kundan ${extra} ta ko'proq ${n.verb}. Uch kunda jami nechta ${n.what} ${n.verb}?`,
      ans:total, label:'Javob:',
      hint:`1-kun=${d1}, 2-kun=${d2}, 3-kun=${d3}, Jami=${total}`});
  }

  // Q40: §52 O'lchov (yozma)
  {
    const frac=Rq(40,0,1)===0?2:3;
    const ans=Rq(40,100,200,1);
    const realTotal=ans*frac;
    qs.push({id:40,bob:'B4',par:'§52',tag:'Yozma — O\'lchov',
      isWrite:true,
      q:`Suzish havzasining uzunligi ${realTotal} m. Suzuvchi havzaning ${frac===2?'yarmi':'uchdan bir qismi'}ni suzib o'tdi. Suzuvchi necha metr suzdi?`,
      ans:ans, label:'Javob:',
      hint:`${realTotal} : ${frac} = ${ans} m`});
  }

  return qs;
}

  B1:'1-BOB &#x2014; Bir xonali sonlar (&#xA7;1&#x2013;&#xA7;5)',
  B2:'2-BOB &#x2014; Ikki xonali sonlar (&#xA7;6&#x2013;&#xA7;23)',

  B4:'4-BOB &#x2014; Uch xonali sonlar (&#xA7;46&#x2013;&#xA7;52)'
};
const BOB_COUNT = {B1:8,B2:12,B3:12,B4:8};

// 1-65 tugmalar

for(let v=1;v<=65;v++){
  const btn = document.createElement('button');

  grid.appendChild(btn);

let currentV = 0;

function loadVariant(v){
  if(currentV) document.getElementById('vbtn'+currentV).classList.remove('active');
  document.getElementById('vbtn'+v).classList.add('active');
  currentV = v;
  document.getElementById('vinfo').innerHTML = '<strong>Variant &#x2116;'+v+'</strong> &#x2014; 40 ta savol';
  document.getElementById('loading').style.display = 'none';

  const qs = genVariant(v);
  let html = '<div class="v-header">'
    +'<div>'
    +'<div class="vh-title">&#x1F4D0; Diagnostik Test &#x2014; Variant &#x2116;'+v+'</div>'
    +'<div class="vh-sub">M.Usmanov (2-4 sinf) &#x00B7; 1&#x2013;4 bob &#x00B7; 50 daqiqa</div>'
    +'<div class="vh-stats">'
    +'<div class="stat"><strong>40</strong>Savol</div>'
    +'<div class="stat"><strong>37</strong>ABCD</div>'
    +'<div class="stat"><strong>3</strong>Yozma</div>'
    +'<div class="stat"><strong>50 daq</strong>Vaqt</div>'
    +'</div></div>'
    +'<div class="vh-vnum"><small>VARIANT</small>&#x2116;'+v+'</div>'
    +'</div>';

  let lastBob='', qn=0;
  qs.forEach(function(q){
    if(q.bob !== lastBob){
      html += '<div class="bob-sep">'+BOB_NAMES[q.bob]
        +'<span class="bob-badge">'+BOB_COUNT[q.bob]+' ta</span></div>';
      lastBob = q.bob;
    }
    qn++;
    html += '<div class="card"><div class="qnum">'+qn+'</div><div>';
    html += '<span class="tag">'+q.par+' &#x00B7; '+q.tag+'</span>';

    if(q.isWrite){
      html += '<div class="qtext">'+q.q+'</div>';
      html += '<div class="write-box">'
        +'<div class="write-lbl">&#x270D;&#xFE0F; Yozma javob</div>'
        +'<div style="font-size:12px;margin-top:4px">'+q.label
        +'<span class="ans-show">'+q.ans+'</span></div>'
        +'<div class="hint-show">&#x1F4A1; '+q.hint+'</div>'
        +'</div>';
    } else {
      html += '<div class="qtext">'+q.q+'</div>';
      if(q.svg) html += '<div class="qsvg">'+q.svg+'</div>';
      html += '<div class="opts">';
      q.opts.forEach(function(o){
        var ok = o.l === q.cor;
        html += '<div class="opt'+(ok?' ok':'')+'">'+o.l+') '+o.v+(ok?' &#x2713;':'')+'</div>';
      });
      html += '</div>';
      html += '<div class="why">&#x2705; Javob: '+q.cor+') &#x2014; '+q.why+'</div>';
    }
    html += '</div></div>';
  });

  document.getElementById('content').innerHTML = html;
  window.scrollTo({top:108, behavior:'smooth'});
}
