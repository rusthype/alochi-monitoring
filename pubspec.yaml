name: alochi_monitoring
description: Alochi Monitoring — Maktab test tizimi
version: 1.0.56+56

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Network
  http: ^1.2.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^6.0.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

  # Local storage (offline queue)
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.0
  pdf: ^3.11.1
  printing: ^5.13.1
  open_filex: ^4.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

  # File picking (PDF upload for boss create flow)
  file_picker: ^8.1.6

  # UI
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  flutter_svg: ^2.0.10  # render inline SVG diagrams (math geometry questions)

  # Windows MSIX installer
  msix: ^3.16.7
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  mac_menu_bar: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/questions.json
    - assets/bob1_4.json
    - assets/fonts/
    - assets/interhouse/
    - assets/interhouse/img/
    - assets/unit1/unit1_eng.json
    - assets/unit1/img/

msix_config:
  display_name: Alochi Monitoring
  publisher_display_name: Alochi Education
  identity_name: alochi.monitoring
  publisher: CN=Alochi Education
  msix_version: 1.0.56.0
  logo_path: assets/logo.png
  start_menu_icon_path: assets/logo.png
  tile_icon_path: assets/logo.png
  icons_background_color: "#F97316"
  architecture: x64
  capabilities: internetClient
  languages: uz, ru, en
  sign_msix: false
  output_path: build/windows/
  output_name: alochi-monitoring
